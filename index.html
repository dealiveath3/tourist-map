  .rarity-badge {

    padding: 2px 8px;

    font-size: 12px;

  }
  .rarity-n   { background: #aaa; color: white; }
  .rarity-r   { background: #4caf50; color: white; }

  .rarity-ssr { background: #9c27b0; color: white; }
  .rarity-ur  { background: linear-gradient(90deg, #f39c12, #e74c3c); color: white; }
</style>

</head>
<body>
  <div style="padding: 10px; background: #eee;">

  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>

    const map = L.map('map').setView([36.2048, 138.2529], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function getDayName() {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      return days[new Date().getDay()];
    }

    function getCongestionLevel(day, weather) {
      const weekend = ['Saturday', 'Sunday'];
      const isWeekend = weekend.includes(day);
      const isSunny = weather === 'Clear' || weather === 'Clouds';
      if (isWeekend && isSunny) return { level: 'high', color: 'red' };
      if (isWeekend && !isSunny) return { level: 'medium', color: 'orange' };
      if (!isWeekend && isSunny) return { level: 'medium', color: 'yellow' };
      return { level: 'low', color: 'blue' };
    }

async function fetchWeather(city) {
  const url = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&appid=${apiKey}&units=metric`;
  const response = await fetch(url);
  const data = await response.json();
  
  return {
    weather: data.weather[0].main,  // 例: 'Clear', 'Rain'
    temp: data.main.temp            // 気温（摂氏）
  };
}


async function displayCities() {
  const day = getDayName();
  for (const city of cities) {
    try {
      const { weather, temp } = await fetchWeather(city);
      const { level, color } = getCongestionLevel(day, weather);

      // ✅ 先に marker を作成！
      const marker = L.circleMarker([city.lat, city.lon], {
        radius: 10,
        color: color,
        fillColor: color,
        fillOpacity: 0.8
      }).addTo(map);

      const congestionLabel = level === 'low' ? '🔵 空いてる（レアあり！）' : level === 'medium' ? '🟡 普通' : '🔴 混雑';
      const popupContent = L.DomUtil.create('div');
      popupContent.innerHTML = `
        <strong>${city.name}</strong><br>
        天気: ${weather}　気温: ${temp}℃<br>
        混雑度: ${congestionLabel}<br>
      `;
      const button = L.DomUtil.create('button', '', popupContent);
      button.textContent = "📍 GPSでチェックイン";
      button.onclick = () => checkinWithGPS(city, level);

      // ✅ markerにポップアップをバインド
      marker.bindPopup(popupContent);

      await new Promise(resolve => setTimeout(resolve, 300));
    } catch (err) {
      console.error(`天気情報の取得に失敗: ${city.name}`, err);
    }
  }
}


    const materials = ["温泉", "自然", "歴史", "伝説", "グルメ", "祭り", "動物", "パワースポット"];

    function getRandomMaterial() {
      return materials[Math.floor(Math.random() * materials.length)];
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getRarityReward(congestionLevel) {
      const material = materials[Math.floor(Math.random() * materials.length)];
      const rand = Math.random();
      let rarity;
      if (congestionLevel === 'low') {
        if (rand < 0.05) rarity = 'UR';
        else if (rand < 0.20) rarity = 'SSR';
        else if (rand < 0.50) rarity = 'SR';
        else rarity = 'R';
      } else if (congestionLevel === 'medium') {
        if (rand < 0.05) rarity = 'SR';
        else if (rand < 0.30) rarity = 'R';
        else rarity = 'N';
      } else {
        rarity = 'N';
      }
      return { material, rarity };
    }

    function checkinWithGPS(city, congestionLevel) {
      if (!navigator.geolocation) {
        alert("このブラウザはGPSに対応していません。");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const distanceKm = getDistance(position.coords.latitude, position.coords.longitude, city.lat, city.lon);
          if (distanceKm <= 1.0) {
            const { material, rarity } = getRarityReward(congestionLevel);
            alert(`✅ チェックイン成功！\n「${material}」[${rarity}] をゲット！`);
            saveMaterial(city.name, material, rarity);
          } else {
            const distanceM = Math.round(distanceKm * 1000);
            alert(`📍 現在地から約${distanceM}m離れています。\n1km以内に近づいてチェックインしてください。`);
          }
        },
        (error) => {
          if (error.code === error.PERMISSION_DENIED) {
            alert("位置情報の許可が必要です。\nブラウザの設定から位置情報を許可してください。");
          } else {
            alert("GPS取得に失敗しました。もう一度お試しください。");
          }
        },
        { timeout: 10000 }
      );
    }

   function saveMaterial(city, material, rarity) {
  const today = new Date().toISOString().split('T')[0];
  const key = `materials_${today}`;
  let data = JSON.parse(localStorage.getItem(key)) || [];
  data.push({ city, material, rarity: rarity || 'N' });
  localStorage.setItem(key, JSON.stringify(data));
  displayCollectedMaterials();
}

   function displayCollectedMaterials() {
  const today = new Date().toISOString().split('T')[0];
  const key = `materials_${today}`;
  let data = JSON.parse(localStorage.getItem(key)) || [];
  const container = document.getElementById('material-log');
  container.innerHTML = "<h3>本日ゲットした素材</h3>";
  if (data.length === 0) {
    container.innerHTML += "<p>まだ素材はありません。チェックインして素材をゲットしよう！</p>";
    return;
  }
  const list = document.createElement('ul');
  data.forEach(entry => {
    const r = entry.rarity || 'N';
    const item = document.createElement('li');
    item.innerHTML = `🧭 ${entry.city} → 「${entry.material}」<span class="rarity-badge rarity-${r.toLowerCase()}">${r}</span>`;
    list.appendChild(item);
  });
  container.appendChild(list);
}


window.onload = () => {
  displayCities();
  displayCollectedMaterials();
};
